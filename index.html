<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spanish Election Data Explorer</title>
  <meta name="description" content="This 3D data visualization shows every moment a team was leading or trailing" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles/index.css" />
  <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.176/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176/examples/jsm/",
          "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm"
        }
      }
    </script>
  <script type="module" src="./scripts/index.js"></script>
</head>

<body>
  <header>
    <div class="heading">
      <h1>Election Data Explorer</h1>
      <p style="white-space: nowrap"><strong>Explore socio-economic and election data from Spain</strong></p>
    </div>
  </header>
  <main>
    <div id="election-chart-container" style="width: 100%; min-height: 400px; border: 1px solid #ccc;"></div>
    <section class="stories">
      <p>Further analysis and highlights will be shown here in the future.</p>
    </section>
    <section class="filters">
      <h2 class="collapse" onclick="app.filters.collapse()">
        <button>Filters</button>
      </h2>

      <form onsubmit="return false">
        <div class="filter-group">
          <label for="ccaa-filter">Autonomous Community (CCAA):</label>
          <select name="ccaa" id="ccaa-filter">
            <option value="all" selected>All Communities</option>
            <!-- Options will be populated by Filters.js -->
          </select>
        </div>
      </form>
    </section>

    <section class="stats">
      <div id="stats-total-population">Total Population: 0</div>
      <div id="stats-total-votes">Total Votes: 0</div>
      <div id="stats-selected-region">Selected Region: All</div>
    </section>
    <!--
    <aside>
      <a href="https://www.basketball-reference.com/"
        data-href="https://www.basketball-reference.com/boxscores/shot-chart/{id}.html" target="_blank">
        See game details →<br> <small>on basketball-reference.com</small>
      </a>
    </aside>
    -->
  </main>
  <footer>
    <p>
      <small>
        Data Explorer. Source data provided.
        <!-- <span class="fps"></span> -->
      </small>
    </p>
  </footer>
</body>

</html>
